# =============================================================
# MyTimeline — orchestration dev en une commande (#37)
#   docker compose up        -> postgres + backend + frontend
#   docker compose down      -> arrêt propre (volumes de données CONSERVÉS)
# Aucun secret en dur : tout vient de .env (voir .env.example) avec des
# defaults dev intégrés pour un boot immédiat sans configuration.
# =============================================================

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eventmanager}
      POSTGRES_USER: ${DB_USERNAME:-eventuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-motdepasse_dev_local}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Backend démarre APRÈS postgres healthy (ddl-auto=validate + Flyway au boot
      # exigent un schéma joignable). -U/-d ciblent la vraie base/rôle.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-eventuser} -d ${POSTGRES_DB:-eventmanager}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      # Datasource pointée sur le SERVICE compose `postgres` (réseau interne).
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-eventmanager}
      DB_USERNAME: ${DB_USERNAME:-eventuser}
      DB_PASSWORD: ${DB_PASSWORD:-motdepasse_dev_local}
      # Défaut dev insécurisé si absent du .env (profil dev tolère). À changer.
      # Base64 STANDARD valide (JwtService décode via Decoders.BASE64) : 48 octets
      # décodés >= 32 requis pour HS256. L'ancien default à base de '-' cassait le
      # décodage -> 500 sur tout login. Aligné sur application-dev.properties.
      JWT_SECRET: ${JWT_SECRET:-ZGV2LW9ubHktaW5zZWN1cmUtand0LXNlY3JldC1jaGFuZ2UtbWUtcGVyLXBvc3Qh}
      # Avatars persistés sur le volume monté ci-dessous.
      STORAGE_AVATAR_PATH: /app/var/avatars
    ports:
      - "8080:8080"
    volumes:
      - avatars-data:/app/var/avatars
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      args:
        # Bakée au build (variable NEXT_PUBLIC_*). Joignable depuis le navigateur.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api}
    depends_on:
      - backend
    environment:
      # #322 — origine canonique des redirections du middleware. Lue au RUNTIME
      # (pas un ARG de build : changer le domaine ne doit pas exiger un rebuild).
      # VIDE par défaut => dégradé assumé, comportement d'avant #322 inchangé en
      # dev local. À renseigner en prod/preview, cf. .env.example et ADR-004.
      APP_CANONICAL_HOST: ${APP_CANONICAL_HOST:-}
    ports:
      - "3000:3000"
    healthcheck:
      # wget est fourni par busybox dans node:20-alpine.
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres-data:
  avatars-data:
