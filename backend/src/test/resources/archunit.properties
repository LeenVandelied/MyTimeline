# ArchUnit (#166) — configuration du gel des violations hexagonales.
#
# La baseline gelée est stockée dans le classpath de test, sous archunit_store/, et
# VERSIONNÉE : seule une NOUVELLE violation casse la CI, l'historique n'est pas re-signalé.
#
# allowStoreCreation reste à FALSE en fonctionnement normal (et en CI) : la baseline ne
# doit JAMAIS être régénérée silencieusement par un run. Pour (re)générer le store après
# une correction d'hygiène — dégel volontaire — relancer une fois avec :
#   ./mvnw test -Darchunit.freeze.store.default.allowStoreCreation=true
# puis commiter les fichiers archunit_store/ modifiés.
freeze.store.default.allowStoreCreation=false
freeze.store.default.path=src/test/resources/archunit_store
