# =============================================================
# Profil TEST — base Postgres ÉPHÉMÈRE (Testcontainers), JAMAIS la base dev.
# Activé via @ActiveProfiles("test") (AbstractPostgresIntegrationTest).
#
# La datasource (url/username/password) est injectée DYNAMIQUEMENT depuis le
# conteneur jetable par @DynamicPropertySource — elle override les defaults
# localhost:5432/eventmanager de application.properties. Aucune valeur de
# connexion en dur ici (le conteneur expose un port aléatoire).
# =============================================================

# Schéma géré par Flyway (V1 baseline + V2 contraintes uniques), rejoué FROM
# SCRATCH sur le conteneur vierge. Hibernate se contente de valider (#42).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway actif : conteneur vierge → V1 puis V2 jouées intégralement.
# baseline-on-migrate sans effet sur un schéma vide (aucun objet préexistant),
# conservé pour cohérence avec les autres profils.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Signature JWT RS256 (#323) — VOLONTAIREMENT VIDE : JwtService génère une paire RSA
# ÉPHÉMÈRE au démarrage de chaque contexte Spring. Aucune clé RSA n'est committée (le
# dépôt est PUBLIC), et une clé figée ici en serait une. Chaque contexte de test est ainsi
# auto-suffisant sans dépendre d'une variable d'env CI. Coût mesuré : une génération
# RSA-2048 par contexte (quelques dizaines de ms), négligeable devant le boot Spring.
# ⚠ Corollaire : un token émis par un contexte n'est PAS relisible par un autre contexte —
# aucun test ne le fait (les tokens sont produits et consommés dans la même app).
jwt.private-key=

# Secret HMAC factice (NON secret) des tokens de download d'export (#323) : neutralise
# ${EXPORT_TOKEN_SECRET} potentiellement absent de l'env CI/local. Base64 STANDARD,
# décodé >= 32 octets (ExportTokenService.validateSecret le vérifie au boot, fail-fast).
app.export.token-secret=dGVzdC1vbmx5LWluc2VjdXJlLWV4cG9ydC10b2tlbi1zZWNyZXQtY2hhbmdlLW1lIQ==

# Stockage avatar (#75) — répertoire temporaire jetable pour les @SpringBootTest
# (aucun STORAGE_AVATAR_PATH en env CI). LocalStorageAdapter crée le sous-dossier
# au 1er upload ; réclamé par l'OS à l'arrêt.
app.storage.avatar-path=${java.io.tmpdir}/mytimeline-avatars-test

# Stockage export RGPD (#264) — répertoire temporaire jetable, DISTINCT des avatars.
app.storage.export-path=${java.io.tmpdir}/mytimeline-exports-test

# #285 : cap bas du pool Hikari pour le profil test. Chaque @SpringBootTest avec un
# jeu de proper={...} unique crée un CONTEXTE Spring caché supplémentaire (donc +1 pool
# Hikari). Multipliés, ces contextes frôlent max_connections du conteneur Postgres
# (Testcontainers) -> "FATAL: sorry, too many clients already" (observé S37 sur
# ExportEndpointsIntegrationTest, #139). Un pool bas (2) suffit : les @SpringBootTest ne
# consomment pas de connexions concurrentes nombreuses, et borner par contexte réduit
# d'autant le total ouvert simultanément.
spring.datasource.hikari.maximum-pool-size=2

# #568 (PIT-S81-023, DEC-S81-007) : AUCUN dump MockMvc, même sur échec. Par défaut,
# @AutoConfigureMockMvc (17 classes, toutes sans argument, toutes sur le profil test via
# AbstractPostgresIntegrationTest) imprime l'échange HTTP COMPLET quand un test échoue,
# en-têtes compris : `Set-Cookie: jwt=eyJ…` part en clair dans la sortie standard ET dans
# le rapport surefire XML. Le dépôt est PUBLIC → les logs GitHub Actions sont lisibles par
# tous. Masquer ses propres messages d'assertion ne suffit pas : Spring imprime le jeton
# brut à côté. Valeurs (enum MockMvcPrint, Boot 3.5) : default | log_debug | system_out |
# system_err | none.
# Coût ACCEPTÉ : un test MockMvc rouge n'affiche plus requête/réponse ; le diagnostic se
# fait sur le message d'assertion.
# Diagnostic ponctuel EN LOCAL uniquement (une propriété système prime sur ce fichier) :
#   cd backend && ./mvnw -Dtest=<Classe> -Dspring.test.mockmvc.print=default test
# Ne JAMAIS committer une réactivation (ici, dans @SpringBootTest(properties) ou dans
# @AutoConfigureMockMvc(print = …)), ni la passer à un job CI.
spring.test.mockmvc.print=none
