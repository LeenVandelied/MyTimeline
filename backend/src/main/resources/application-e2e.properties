# =============================================================================
# Profil `e2e` — surcouche ADDITIVE, activee UNIQUEMENT par les stacks de test
# bout-en-bout : job CI `e2e` (.github/workflows/ci.yml, SPRING_PROFILES_ACTIVE=dev,e2e)
# et service `backend-e2e` (docker-compose.yml, meme liste).
#
# Ce profil n'est JAMAIS actif en dev local (profil `dev` seul) ni en prod, ou
# `ProfileSafetyGuard` (#283) refuse meme le boot s'il est demande a cote d'un
# marqueur d'environnement de production.
# =============================================================================

# --- #475 / #547 : plafonds de rate-limit dedies au profil e2e ---------------
#
# LE FILTRE EST ARME PENDANT LES RUNS E2E (#547)
#
# Jusqu'au S88, le job CI `e2e` et le service `backend-e2e` posaient
# `RATE_LIMIT_ENABLED=false`, qui court-circuitait le filtre ENTIER : aucun plafond
# n'etait en vigueur pendant un run, et rien ne pouvait exercer le chemin reseau reel
# (proxy Next, cle de comptage par IP de socket, interaction CORS / rate-limit).
# #547 a retire ce drapeau. Les valeurs ci-dessous sont donc REELLEMENT appliquees par
# `RateLimitingFilter` pendant chaque run, et un depassement rend un vrai 429.
#
# LA CLE DE COMPTAGE — pourquoi tout tombe dans UN seul seau par creneau
#
# Le navigateur ne parle pas au backend : le proxy Next (`/api/*`) relaie. Avec
# `app.rate-limit.trust-forwarded-header=false`, TOUTES les requetes d'un run comptent
# sur l'IP du serveur Next (loopback en CI ; passerelle Docker via compose) : les 2
# workers, les retries et, en CI, les DEUX serveurs Next (:3000 degrade, :3001
# verifiant) partagent le meme seau.
#
# LA REGLE DE DIMENSIONNEMENT
#
#   - nominal CI = somme sur les DEUX passes Playwright du job `e2e` (passe 1 = suite
#     complete ; passe 2 = `auth.setup.ts auth-signature.spec.ts`, qui re-provisionne
#     les comptes contre le MEME backend — les seaux vivent dans la JVM et survivent
#     entre passes, qui s'enchainent en serie) ;
#   - pire cas CI = chaque emission de spec x (1 + retries), `retries: 2` en CI ;
#     le setup n'est PAS multiplie, et ce n'est vrai que sous deux conditions LUES par le
#     Vitest (revue S88, arbitrage dev du 2026-09-14) : le projet `setup` n'a aucun retry
#     Playwright (`setup.describe.configure({ retries: 0 })`), et sa boucle de soumission
#     ne re-emet le register que sur ECHEC DE REQUETE (5xx ou aucune reponse ; jamais sur
#     201/409/429 ni sur page lente). D'ou UN login et UN register par compte par passe,
#     hors requetes deja en echec. Avant cette correction la boucle re-emettait sur page
#     lente : pire cas register 36, au-dessus du plafond ;
#   - le total d'une passe est un majorant sur du pic par minute (refill `intervally`).
#
# Ces chiffres sont RECOMPTES depuis les sources par
# `frontend/src/__tests__/e2e-rate-limit-budget.test.ts`, qui lit les lignes `BUDGET`
# ci-dessous et rougit si l'une d'elles ment, ou si un plafond passe sous le pire cas.
# Ils ont ete MESURES au S88 sur une pile armee derriere un proxy de comptage : compte
# mesure = compte statique, creneau par creneau, 0 x 429.
#
#   BUDGET register         nominal-ci=12  pire-cas-ci=20  plafond=30  defaut=5
#   BUDGET login            nominal-ci=12  pire-cas-ci=20  plafond=30  defaut=10
#   BUDGET reset-password   nominal-ci=4   pire-cas-ci=12  plafond=15  defaut=5
#   BUDGET forgot-password  nominal-ci=3   pire-cas-ci=9   plafond=5   defaut=5
#   BUDGET change-password  nominal-ci=2   pire-cas-ci=6   plafond=5   defaut=5
#
# (Les autres creneaux — refresh, export GET/POST, PATCH /api/me, avatar — emettent au
# plus 1 par passe, pire cas 3, sous leur defaut : aucun traitement.)

# register : 4 comptes du setup + 1 golden-path + 3 `support/auth.ts#registerOnly`
# = 8 par passe 1, + 4 en passe 2 = 12. #475 avait fixe 20 sur un budget de 8 qui
# OUBLIAIT la passe 2 ; au pire cas CI (20) la marge tombait a 0. 30 = 2,5 x le nominal
# CI (meme ratio que #475), marge 10 sur le pire cas.
app.rate-limit.register-per-minute=30

# login : 4 comptes du setup + golden-path 1 + forgot-password 1 + reset-password-
# failures 2 = 8 par passe 1, + 4 en passe 2 = 12 — deja AU-DESSUS du defaut (10) en
# nominal. Pire cas 20. 30 = 2,5 x le nominal CI, marge 10 sur le pire cas.
app.rate-limit.login-per-minute=30

# reset-password (seau PAR IP) : forgot-password 1 + reset-password-failures 3 = 4,
# marge 1 seulement sous le defaut (5) en nominal ; pire cas 12. 15 = marge 3 sur le
# pire cas. Le throttle PAR TOKEN (#141, 5 tentatives / token / minute) n'est PAS
# touche : chaque tentative de test utilise un compte et donc un token neufs (<= 2 / token).
app.rate-limit.reset-password-per-minute=15

# forgot-password et change-password RESTENT AU DEFAUT (5), deliberement, sans propriete.
#   forgot-password  : nominal CI 3 / 5, pire cas 9 / 5 ;
#   change-password  : nominal CI 2 / 5, pire cas 6 / 5.
# Le depassement exige qu'une spec emettrice soit RETENTEE DEUX FOIS dans la minute, donc
# qu'elle ait deja echoue deux fois pour une autre raison : le 429 fait alors rougir un
# test deja en echec au lieu de le laisser passer « flaky ». Un run qui passe du premier
# coup ne peut pas les atteindre. Relever ces plafonds acheterait du vert sur des tests
# instables sans rien proteger.
#
# Chaque plafond reste un VRAI plafond : la requete N+1 de la minute prend un 429
# (asserte par RateLimitE2eProfileIntegrationTest). On dimensionne, on ne desarme rien.
