# =============================================================================
# Profil `e2e` — surcouche ADDITIVE, activee UNIQUEMENT par les stacks de test
# bout-en-bout : job CI `e2e` (.github/workflows/ci.yml, SPRING_PROFILES_ACTIVE=dev,e2e)
# et service `backend-e2e` (docker-compose.yml, meme liste).
#
# Ce profil n'est JAMAIS actif en dev local (profil `dev` seul) ni en prod, ou
# `ProfileSafetyGuard` (#283) refuse meme le boot s'il est demande a cote d'un
# marqueur d'environnement de production.
# =============================================================================

# --- #475 : plafond `register` dedie au profil e2e ---------------------------
#
# CE QUE CETTE VALEUR CORRIGE
#
# La suite Playwright emet plusieurs `POST /api/auth/register` depuis UNE SEULE IP
# (le runner CI, ou localhost) :
#   - projet `setup` (frontend/e2e/auth.setup.ts) : 1 register par compte fixe de
#     `ALL_ACCOUNTS` (frontend/e2e/support/accounts.ts) = 4 ;
#   - `golden-path.spec.ts` : 1 auto-inscription ;
#   - `support/auth.ts#registerOnly`, appele par `forgot-password.spec.ts` (1) et
#     `reset-password-failures.spec.ts` (2) : 3 ;
#   => 8 registers par passe nominale, dans une fenetre de l'ordre de la minute
#      (CI: workers=1, les 4 provisions s'enchainent en serie).
#
# ⚠ CHIFFRE CORRIGE AU CYCLE 2 DE REVUE DU S79 : il valait 5 ici, parce que le
# compteur de `frontend/src/__tests__/e2e-register-budget.test.ts` ne regardait que
# les fichiers `*.spec.ts` et ne voyait pas une inscription emise depuis un helper de
# `e2e/support/`. Les 3 registers de `registerOnly` manquaient au budget. Le compteur
# resout desormais cette indirection ; c'est lui qui fait foi, pas ce commentaire.
#
# Le plafond PAR DEFAUT de `RateLimitingFilter` est de 5/min/IP. Le budget nominal le
# DEPASSAIT donc deja (8 pour 5). Toute spec qui s'inscrit en plus, et tout retry
# (`retries: 2` en CI, plus la boucle interne `REGISTER_RETRIES=3` d'auth.setup.ts),
# aggrave.
#
# 20 = 2,5x le pic nominal d'une minute (8). Marge = 12 registers supplementaires par
# minute avant le 429. Couvre le pire cas credible du provisioning (4 provisions x 3
# tentatives internes = 12) et laisse de la place a de nouvelles specs.
#
# CE QUE CETTE VALEUR NE FAIT PAS — a lire avant d'en conclure quoi que ce soit.
#
# Le job CI `e2e` et le service `backend-e2e` posent aujourd'hui
# `RATE_LIMIT_ENABLED=false`, qui court-circuite le filtre ENTIER (tous les slots,
# tous les endpoints) des `doFilterInternal`. Tant que cette variable est la, AUCUN
# plafond n'est en vigueur pendant un run E2E : ni 5, ni 20. Cette propriete est donc
# une condition NECESSAIRE au re-armement du filtre en E2E, pas le re-armement
# lui-meme. Le desarmer suppose de recompter d'abord le budget du slot `login`
# (10/min/IP : 4 connexions du `setup` + celles des specs), qui n'a pas ete mesure.
#
# Le plafond reste un VRAI plafond : une boucle de spam d'inscriptions prend un 429
# a la 21e requete de la minute. On ne desarme rien, on dimensionne.
app.rate-limit.register-per-minute=20
