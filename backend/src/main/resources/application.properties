# =============================================================
# Configuration COMMUNE (tous profils)
# AUCUN secret en clair ici — secrets via variables d'environnement.
# Profil actif par défaut : dev (override via SPRING_PROFILES_ACTIVE).
# =============================================================
# Le default ':dev' est CONSERVÉ pour le confort dev (mvn/IDE démarrent sans var).
# GARDE-FOU FAIL-FAST (#111) : ProfileSafetyGuard refuse le boot si le profil 'dev'
# est actif ALORS qu'un marqueur d'env de production est présent (ENVIRONMENT=production
# ou APP_ENV=production). En prod : poser SPRING_PROFILES_ACTIVE=prod ET ENVIRONMENT=production.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Datasource (commun)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/eventmanager}
spring.datasource.username=${DB_USERNAME:eventuser}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate (JPA) — commun
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway (#42) — migrations versionnées, source unique de vérité du schéma.
# baseline-on-migrate=true : indispensable pour les bases déjà peuplées
# (dev/prod existantes) afin que V1 soit posé comme baseline sans rejouer
# de DDL sur des tables déjà présentes.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Sécurité JWT — clé secrète OBLIGATOIRE via variable d'environnement.
# Aucun default : l'app refuse de démarrer sans JWT_SECRET (fail-fast).
jwt.secret=${JWT_SECRET}

# Cookie JWT (#99 / BR-AUT-007 / A6+A7) — attributs Secure et Domain par profil.
# Defaults de base FAIL-SAFE : si aucun profil actif ET aucune env var, on reste
# sécurisé (Secure=true, host-only). Chaque profil override ci-dessous :
# - dev  : Secure=false / Domain=localhost (override explicite, dev http local OK)
# - prod : Secure=true  / Domain=<domaine prod> (env COOKIE_DOMAIN)
# Domain vide => attribut Domain non posé (host-only cookie).
app.cookie.secure=${COOKIE_SECURE:true}
app.cookie.domain=${COOKIE_DOMAIN:}

# Upload avatar (#75) — limites multipart serveur (defense in depth avec le contrôle
# applicatif dans AvatarServiceImpl). max-file-size borne UN fichier, max-request-size
# borne la requête entière. Dépassement -> MaxUploadSizeExceededException -> 400.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Taille max applicative (octets) re-vérifiée côté service (5 Mo = 5242880).
app.storage.avatar-max-bytes=${AVATAR_MAX_BYTES:5242880}
# Chemin de stockage LOCAL PRIVÉ des avatars (#75, ADR Sprint 21 — hors webroot).
# Convention #34 (comme JWT_SECRET) : AUCUN default ici -> boot ÉCHOUE sans la valeur.
# Le profil dev fournit un default local ; le profil prod impose STORAGE_AVATAR_PATH
# via env (fail-fast). Résolu par LocalStorageAdapter (répertoire créé au 1er upload).
app.storage.avatar-path=${STORAGE_AVATAR_PATH}

# Rate limiting (#33)
# X-Forwarded-For is client-controllable. Keep this false unless the service is
# deployed behind a TRUSTED reverse proxy that strips/overwrites client-supplied
# XFF; otherwise an attacker rotates the header to bypass per-IP throttling.
# When true, the first XFF hop is used as the rate-limit key; when false (default),
# the socket remote address is used.
app.rate-limit.trust-forwarded-header=false
# Master switch. Default fail-safe TRUE (rate limiting always ON). Le SEUL contexte
# qui pose false est le job CI e2e éphémère (via env RATE_LIMIT_ENABLED=false), dont
# le setup Playwright provisionne plusieurs comptes depuis l'IP unique du runner et
# déclencherait sinon le throttle par IP. NE JAMAIS désactiver en dev/prod.
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}

# Mot de passe oublié + email Brevo (#49)
# BREVO_API_KEY : clé API Brevo, OBLIGATOIRE en prod via env. JAMAIS en dur.
# Default vide intentionnel : en dev/test sans clé, BrevoEmailService passe en
# no-op (warning) au lieu de crasher — le flux forgot-password reste fonctionnel
# (token créé) et BR-AUT-005 (réponse 200) est préservée.
brevo.api.key=${BREVO_API_KEY:}
brevo.sender.email=${BREVO_SENDER_EMAIL:no-reply@mytimeline.app}
brevo.sender.name=${BREVO_SENDER_NAME:MyTimeline}
# Base de l'URL de réinitialisation insérée dans l'email (front #53). Le token est
# ajouté en query param (?token=...). Override par profil/env.
app.frontend.reset-url-base=${RESET_URL_BASE:http://localhost:3000/reset-password}
# Durée de validité du token de réinitialisation (cadrage S8 : 15 min).
app.password-reset.token-validity-minutes=${PASSWORD_RESET_TOKEN_VALIDITY_MINUTES:15}
