# =============================================================
# Profil DEV — defaults raisonnables pour le poste local.
# JAMAIS de secret de prod ici. Les defaults dev ci-dessous sont
# uniquement pour faciliter le boot local (DB locale jetable).
# =============================================================

# Hibernate dev : schéma géré par Flyway, Hibernate se contente de valider (#42).
# Plus de modif auto du schéma au boot (update dangereux). SQL visible conservé.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Defaults dev pour secrets (override possible via env).
# DB_PASSWORD : default dev local. JAMAIS utilisé en prod (profil prod sans default).
spring.datasource.password=${DB_PASSWORD:motdepasse_dev_local}
# JWT_SECRET : default dev local (NON secret, à régénérer par poste si besoin).
# En prod, le profil prod impose JWT_SECRET via env sans default.
# ATTENTION : la valeur doit être du Base64 STANDARD valide (JwtService décode via
# Decoders.BASE64). L'ancien default contenait des '-' -> décodage KO -> tout login
# renvoyait 500. Ce default est du Base64 alphanumérique (48 octets décodés >= 32
# requis pour HS256). Décode en ASCII "dev-only-insecure-jwt-secret-change-me-per-post!".
jwt.secret=${JWT_SECRET:ZGV2LW9ubHktaW5zZWN1cmUtand0LXNlY3JldC1jaGFuZ2UtbWUtcGVyLXBvc3Qh}

# Cookie JWT (#99) — dev local : pas de HTTPS, domaine localhost.
app.cookie.secure=false
app.cookie.domain=localhost

# CORS (#120) — origine(s) autorisée(s), liste séparée par virgules.
# Dev local : le front Next.js tourne sur http://localhost:3000.
app.cors.allowed-origins=http://localhost:3000

# Stockage avatar (#75) — default LOCAL dev (répertoire jetable hors webroot).
# En prod, le profil prod impose STORAGE_AVATAR_PATH via env (aucun default).
app.storage.avatar-path=${STORAGE_AVATAR_PATH:./var/avatars-dev}

# Stockage export RGPD (#264) — default LOCAL dev (répertoire jetable hors webroot),
# DISTINCT des avatars. En prod, le profil prod impose STORAGE_EXPORT_PATH (aucun default).
app.storage.export-path=${STORAGE_EXPORT_PATH:./var/exports-dev}
