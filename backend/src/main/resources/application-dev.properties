# =============================================================
# Profil DEV — defaults raisonnables pour le poste local.
# JAMAIS de secret de prod ici. Les defaults dev ci-dessous sont
# uniquement pour faciliter le boot local (DB locale jetable).
# =============================================================

# Hibernate dev : schéma géré par Flyway, Hibernate se contente de valider (#42).
# Plus de modif auto du schéma au boot (update dangereux). SQL visible conservé.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Defaults dev pour secrets (override possible via env).
# DB_PASSWORD : default dev local. JAMAIS utilisé en prod (profil prod sans default).
spring.datasource.password=${DB_PASSWORD:motdepasse_dev_local}
# JWT_PRIVATE_KEY (#323) — VIDE par défaut en dev : JwtService génère une paire RS256
# ÉPHÉMÈRE au démarrage et journalise sa clé publique en INFO (à coller dans
# AUTH_JWT_PUBLIC_KEY côté frontend pour tester la vérification du middleware).
# Aucune clé RSA n'est committée : le dépôt est PUBLIC, et une clé « de dev » figée
# finirait tôt ou tard copiée ailleurs. Contrepartie assumée : les sessions locales ne
# survivent pas à un redémarrage du backend. Poser JWT_PRIVATE_KEY pour les figer.
jwt.private-key=${JWT_PRIVATE_KEY:}

# EXPORT_TOKEN_SECRET (#323) — default dev NON secret, manifestement jetable.
# Base64 STANDARD, 49 octets décodés (>= 32 requis pour HS256).
# Décode en ASCII "dev-only-insecure-export-token-secret-change-me!!".
app.export.token-secret=${EXPORT_TOKEN_SECRET:ZGV2LW9ubHktaW5zZWN1cmUtZXhwb3J0LXRva2VuLXNlY3JldC1jaGFuZ2UtbWUhIQ==}

# Cookie JWT (#99) — dev local : pas de HTTPS, domaine localhost.
app.cookie.secure=false
app.cookie.domain=localhost

# CORS (#120) — origine(s) autorisée(s), liste séparée par virgules.
# Dev local : le front Next.js tourne sur http://localhost:3000.
app.cors.allowed-origins=http://localhost:3000

# Stockage avatar (#75) — default LOCAL dev (répertoire jetable hors webroot).
# En prod, le profil prod impose STORAGE_AVATAR_PATH via env (aucun default).
app.storage.avatar-path=${STORAGE_AVATAR_PATH:./var/avatars-dev}

# Stockage export RGPD (#264) — default LOCAL dev (répertoire jetable hors webroot),
# DISTINCT des avatars. En prod, le profil prod impose STORAGE_EXPORT_PATH (aucun default).
app.storage.export-path=${STORAGE_EXPORT_PATH:./var/exports-dev}

# Purge TTL des exports expirés (#267) — dev : balayage plus fréquent (5 min) pour observer
# la purge sans attendre 1h. Délai initial court (10 s) après le boot.
app.export.purge.interval-ms=${EXPORT_PURGE_INTERVAL_MS:300000}
app.export.purge.initial-delay-ms=${EXPORT_PURGE_INITIAL_DELAY_MS:10000}
