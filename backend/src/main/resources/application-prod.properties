# =============================================================
# Profil PROD — AUCUN default secret. Tout vient des variables d'env.
# Le boot ÉCHOUE (fail-fast) si DB_PASSWORD ou JWT_SECRET sont absents.
# Activation : SPRING_PROFILES_ACTIVE=prod
# =============================================================

# Hibernate prod : pas de modif auto du schéma (migrations dédiées), pas de SQL loggué
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Secrets — OBLIGATOIRES via env, aucun default.
spring.datasource.password=${DB_PASSWORD}
jwt.secret=${JWT_SECRET}

# Cookie JWT (#99 / BR-AUT-007 / A6+A7) — prod : HTTPS obligatoire => Secure=true.
app.cookie.secure=true
# COOKIE_DOMAIN (#118) — ÉTAPE OBLIGATOIRE pré-déploiement si l'app utilise des
# sous-domaines (ex: api.mytimeline.app + app.mytimeline.app). Fournir via env :
#   export COOKIE_DOMAIN=mytimeline.app   (eTLD+1, couvre tous les sous-domaines)
# Impact si VIDE : cookie posé en host-only (pas d'attribut Domain) — valide en
# mono-domaine, mais l'auth ÉCHOUE SILENCIEUSEMENT en multi-sous-domaines (le
# cookie n'est pas renvoyé au sous-domaine de l'API). NE PAS deviner le domaine ici.
# Voir docs/runbook/deploiement-profils.md (liste des env prod obligatoires).
app.cookie.domain=${COOKIE_DOMAIN:}

# CORS (#120) — origine(s) front autorisée(s), OBLIGATOIRE via env, aucun default
# de prod deviné. Liste séparée par virgules (ex: https://app.mytimeline.fr,https://www.mytimeline.fr).
# Une valeur manquante => le boot échoue en fail-fast (#253, ProfileSafetyGuard) avec un
# message explicite, plutôt que d'autoriser silencieusement la mauvaise origine.
# allowCredentials=true interdit tout wildcard "*", chaque origine doit être listée explicitement.
# Default vide `:` VOLONTAIRE (comme app.cookie.domain) : permet à ProfileSafetyGuard de lire
# la property et lever l'erreur #253 claire, au lieu d'un "Could not resolve placeholder" opaque.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Stockage avatar (#75, ADR Sprint 21) — répertoire LOCAL PRIVÉ hors webroot,
# OBLIGATOIRE via env, AUCUN default (fail-fast). Doit pointer un volume persistant
# non servi statiquement (l'accès passe uniquement par GET /api/me/avatar authentifié).
# Migration future S3/MinIO = nouvelle impl de StoragePort (pas de changement ici).
app.storage.avatar-path=${STORAGE_AVATAR_PATH}
