version: 2
updates:
  # Toutes les PR visent dev : main ne reçoit que des merges de dev.
  # Backend — dépendances Maven (Spring Boot, etc.)
  - package-ecosystem: maven
    directory: /backend
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: ":arrow_up: #deps —"

  # Frontend — dépendances npm (Next.js, etc.)
  - package-ecosystem: npm
    directory: /frontend
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: ":arrow_up: #deps —"

  # Actions GitHub utilisées par les workflows
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ":arrow_up: #deps —"
