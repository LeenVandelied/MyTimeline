# CI — build + tests backend (Spring Boot / Maven) et frontend (Next.js / npm).
#
# Branch protection : NON activée par ce workflow (volontaire).
#   L'activer AVANT un 1er run vert bloquerait TOUS les merges (dont cette PR).
#   À activer manuellement APRÈS le 1er run vert, par un mainteneur :
#
#   gh api -X PUT repos/LeenVandelied/MyTimeline/branches/dev/protection \
#     -f 'required_status_checks[strict]=true' \
#     -f 'required_status_checks[checks][][context]=backend' \
#     -f 'required_status_checks[checks][][context]=frontend' \
#     -F 'enforce_admins=true' \
#     -F 'required_pull_request_reviews[required_approving_review_count]=1' \
#     -F 'restrictions=null'
#   (idem pour la branche `main`)
#   Ou via l'UI : Settings → Branches → Add rule → "Require status checks"
#   (cocher backend + frontend) + "Require a pull request before merging" (1 review).

name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# Annule les runs obsolètes sur une même PR/branche (économie de temps < 10 min).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    # Docker présent nativement sur ubuntu-latest → Testcontainers Postgres OK.
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build + tests (mvnw verify)
        # SKIP_DELEGATION : neutralise un éventuel hook local de délégation
        # (absent en CI, mais sans effet de bord si défini).
        env:
          SKIP_DELEGATION: "1"
        run: ./mvnw --batch-mode --no-transfer-progress verify

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Tests (Vitest)
        run: npm run test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  # ---------------------------------------------------------------------------
  # E2E (#163) — golden path Playwright full-stack : inscription -> connexion ->
  # produit + événement -> timeline. Lève la stack COMPLÈTE (Postgres + backend
  # Spring Boot + frontend Next.js) car register/login/create sont de vrais appels
  # API. N'ajoute PAS de dépendance aux jobs backend/frontend (tourne en parallèle,
  # sans les casser). N'active AUCUNE branch protection.
  # ---------------------------------------------------------------------------
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    # Postgres 16 en service container : le backend s'y connecte (DB `eventmanager`,
    # user `eventuser`). Flyway rejoue V1..Vn au boot du backend (schéma vide au départ).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: eventmanager
          POSTGRES_USER: eventuser
          POSTGRES_PASSWORD: eventpass_ci
        ports:
          - 5432:5432
        # Healthcheck : GitHub attend que Postgres soit prêt avant les steps.
        options: >-
          --health-cmd "pg_isready -U eventuser -d eventmanager"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Backend : build du jar (skip tests, déjà couverts par le job `backend`).
      - name: Build backend (package, skip tests)
        working-directory: backend
        env:
          SKIP_DELEGATION: "1"
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests package

      # Démarrage du backend en tâche de fond (profil dev : cookie Secure=false,
      # Domain=localhost, CORS http://localhost:3000 déjà autorisé). JWT_SECRET passé
      # explicitement (le profil dev a un default, mais on ne s'appuie pas dessus en CI).
      - name: Start backend (Spring Boot, profil dev, :8080)
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: dev
          DB_URL: jdbc:postgresql://localhost:5432/eventmanager
          DB_USERNAME: eventuser
          DB_PASSWORD: eventpass_ci
          # JwtService décode le secret en Base64 (Decoders.BASE64.decode) puis exige
          # >= 32 octets (HS256). Le secret DOIT donc être une chaîne Base64 valide
          # (pas de '-'/'_' ni de caractères hors alphabet Base64) — sinon generateToken
          # lève et /auth/login renvoie 500. Ci-dessous : 48 octets Base64 (CI-only, non secret).
          JWT_SECRET: Q0lPbmx5SW5zZWN1cmVKd3RTZWNyZXRGb3JFMkVUZXN0c09ubHkwMTIzNDU2Nzg5
          # E2E-ONLY : désactive le rate-limit auth. La suite provisionne plusieurs
          # comptes depuis l'IP unique du runner -> déclencherait le throttle par IP
          # (register 5/min, login 10/min) et ferait échouer le projet Playwright `setup`.
          # Défaut TOUJOURS true partout ailleurs (prod + jobs backend/frontend intacts).
          RATE_LIMIT_ENABLED: false
        run: |
          java -jar target/*.jar > backend.log 2>&1 &
          echo "BACKEND_PID=$!" >> "$GITHUB_ENV"

      # Attente de la disponibilité RÉELLE du backend avant de lancer Playwright
      # (évite le flaky). Pas d'actuator : on poll un endpoint connu — `/api/auth/me`
      # renvoie 401 sans cookie, ce qui prouve que l'app répond (tout code HTTP < 500
      # non vide = up). Timeout ~90s (boot Spring + Flyway).
      - name: Wait for backend readiness
        working-directory: backend
        run: |
          for i in $(seq 1 45); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/auth/me || echo 000)
            if [ "$code" != "000" ] && [ "$code" -lt 500 ]; then
              echo "Backend up (HTTP $code) après ${i} tentative(s)."
              exit 0
            fi
            echo "Attente backend... (tentative ${i}, code=$code)"
            sleep 2
          done
          echo "Backend indisponible après timeout — logs :"
          tail -n 200 backend.log || true
          exit 1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser (chromium)
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Playwright lance lui-même le frontend via `webServer` (npm run dev). En
      # `next dev`, les NEXT_PUBLIC_* et E2E_API_PROXY_TARGET sont lus au RUNTIME
      # depuis l'env du process ; on les pose donc au niveau du step.
      #
      # APPELS API MÊME-ORIGINE (indispensable — cf. next.config.mjs) : le cookie
      # `jwt` est SameSite=Lax et ne serait PAS envoyé sur un POST cross-port
      # (:3000 -> :8080) -> 401 sur la création produit/événement. On route donc
      # tout via le proxy Next : NEXT_PUBLIC_API_URL=/api (origine :3000) +
      # E2E_API_PROXY_TARGET=http://localhost:8080 (rewrite /api/* -> backend).
      # CI=true active retries:2 / workers:1 (playwright.config.ts).
      - name: Run E2E (Playwright golden path)
        working-directory: frontend
        env:
          CI: "true"
          NEXT_PUBLIC_API_URL: /api
          E2E_API_PROXY_TARGET: http://localhost:8080
          # #145 — le spec forgot-password lit le token de reset directement en base
          # (aucun autre canal : email NO-OP en test, pas d'endpoint test-only). Même
          # service Postgres que le backend (localhost:5432, DB/user ci-dessus).
          E2E_DB_HOST: localhost
          E2E_DB_PORT: "5432"
          E2E_DB_NAME: eventmanager
          E2E_DB_USER: eventuser
          E2E_DB_PASSWORD: eventpass_ci
        run: npm run test:e2e

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Dump backend log (on failure)
        if: failure()
        working-directory: backend
        run: tail -n 300 backend.log || true

      # Hygiène : arrêt du backend en fond (le runner éphémère le tuerait de toute
      # façon, mais évite un process orphelin sur d'éventuels reruns / self-hosted).
      - name: Stop backend
        if: always()
        run: kill "$BACKEND_PID" 2>/dev/null || true

  # ---------------------------------------------------------------------------
  # Security (#167) — scan de sécurité des dépendances. Tourne en parallèle des
  # autres jobs, n'ajoute AUCUNE dépendance et n'active AUCUNE branch protection.
  #   - npm audit --audit-level=high : échoue si vuln npm >= high (frontend,
  #     dev+prod — #222 a retiré --omit=dev, l'audit couvre désormais TOUTES les deps).
  #   - trivy fs --severity CRITICAL --exit-code 1 : bloque UNIQUEMENT le critique
  #     (évite le bruit HIGH/MEDIUM ; les CVE CRITICAL sont résolues par #180).
  # permissions: contents: read hérité du niveau workflow (non élargi).
  # ---------------------------------------------------------------------------
  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm audit sur le lockfile frontend. --audit-level=high => code de sortie
      # non nul (donc échec du job) uniquement si une vuln HIGH ou CRITICAL existe.
      # Couvre TOUTES les deps (prod + dev). Le flag --omit=dev de #167 a été retiré
      # en sprint 31 (#222) : la chaîne vitest (2.x -> 3.2.7) et les leaves ReDoS
      # (minimatch/picomatch/flatted) ont été bumpées jusqu'à 0 HIGH/CRITICAL dev
      # inclus. Reste uniquement du MODERATE (next-intl/next/postcss/esbuild) non
      # bloquant à ce niveau. Le scan Trivy ci-dessous couvre le CRITICAL cross-stack.
      - name: npm audit (frontend deps dev+prod, >= high)
        working-directory: frontend
        run: npm audit --audit-level=high

      # Scan filesystem de tout le repo (dépendances backend Maven + frontend npm +
      # secrets/misconfig). exit-code=1 + severity=CRITICAL => build rouge seulement
      # sur du CRITICAL, en cohérence avec le critère d'acceptation #167.
      - name: Trivy filesystem scan (fail on CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
